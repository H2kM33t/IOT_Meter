<!DOCTYPE html>
<html>
<head>
    <title>Power Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            text-align: center;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px;
        }

        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
            width: 150px;
        }

        canvas {
            background: white;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<h1>⚡ Power Monitoring</h1>

<div class="cards">
    <div class="card">
        <h3>Voltage</h3>
        <p id="voltage">0</p>
    </div>

    <div class="card">
        <h3>Current</h3>
        <p id="current">0</p>
    </div>

    <div class="card">
        <h3>Power</h3>
        <p id="power">0</p>
    </div>

    <div class="card">
        <h3>Energy</h3>
        <p id="energy">0</p>
    </div>
</div>

<canvas id="chart" width="800" height="300"></canvas>

<script>
let labels = [];
let data = [];

const ctx = document.getElementById('chart').getContext('2d');

const chart = new Chart(ctx, {
    type: 'line',
    data: {
        labels: labels,
        datasets: [{
            label: 'Power (W)',
            data: data,
            borderWidth: 2
        }]
    }
});

// ===== LIVE VALUES =====
function updateLive() {
    fetch('/data')
    .then(res => res.json())
    .then(d => {
        document.getElementById("voltage").innerText = d.voltage.toFixed(2) + " V";
        document.getElementById("current").innerText = d.current.toFixed(2) + " A";
        document.getElementById("power").innerText = d.power.toFixed(2) + " W";
        document.getElementById("energy").innerText = d.energy.toFixed(3) + " Wh";
    });
}

// ===== GRAPH =====
function updateGraph() {
    fetch('/history')
    .then(res => res.json())
    .then(rows => {
        labels = [];
        data = [];

        rows.forEach(r => {
            let time = new Date(r[0] * 1000).toLocaleTimeString();
            labels.push(time);
            data.push(r[1]);
        });

        chart.data.labels = labels;
        chart.data.datasets[0].data = data;
        chart.update();
    });
}

setInterval(updateLive, 1000);
setInterval(updateGraph, 3000);
</script>

</body>
</html>
